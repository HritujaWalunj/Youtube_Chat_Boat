services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Inside Docker, "localhost" is the container itself, so point at the ollama service.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # One-shot job: downloads the models into the ollama volume, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull ${OLLAMA_CHAT_MODEL:-qwen3:8b}
        ollama pull ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    restart: "no"

volumes:
  ollama_data:
